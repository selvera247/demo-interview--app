# Close-agent policy for Northwind Digital (synthetic demo).
# Agent and MCP tools load this file; do not hardcode thresholds in Python.

variance:
  # Flag when BOTH conditions are true (AND).
  threshold_pct: 0.10          # ten percent MoM
  threshold_amt: 50000         # fifty thousand USD
  require_both: true

# Optional per-account overrides (account_id -> thresholds).
account_overrides: {}

confidence:
  # Map internal evidence_score in [0, 1] → high / med / low (legacy cutoffs;
  # flux confidence is assigned from residual accounting — see residual_tolerance_amt).
  high_min: 0.80
  med_min: 0.55
  # low is anything below med_min
  low_routes_to_human_review: true
  # |residual| at or below this ⇒ high; else med if any support exists.
  # Calibrated from first honest eval MoM noise (~$12k on revenue timing).
  residual_tolerance_amt: 15000

# Manual / unsupported journal entries — always surface, never auto-approve.
unsupported_je:
  always_flag: true
  always_route_to_human_review: true
  treat_blank_description_as_unsupported: true
  treat_missing_vendor_as_unsupported: true
  entry_types:
    - manual_je
