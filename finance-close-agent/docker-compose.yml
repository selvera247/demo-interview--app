# Northwind Digital close demo — FastAPI/LangGraph + Streamlit review UI
# Usage (from finance-close-agent/):
#   docker compose up --build
# API:       http://127.0.0.1:8000/docs
# Streamlit: http://127.0.0.1:8501

services:
  api:
    build: .
    image: northwind-close-demo:latest
    container_name: northwind-close-api
    command: ["api"]
    ports:
      - "8000:8000"
    volumes:
      - finance-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  streamlit:
    build: .
    image: northwind-close-demo:latest
    container_name: northwind-close-ui
    command: ["streamlit"]
    ports:
      - "8501:8501"
    volumes:
      - finance-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    depends_on:
      api:
        condition: service_healthy

volumes:
  finance-data:
