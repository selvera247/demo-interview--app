    period: "2026-07"
    variance: 391978.75
    expected_flagged: true
    expected_confidence: high
    expected_explanation: >
      Subscription revenue is down $400,000 in July, reversing the early
      recognition from June. This is timing, not lost business.
    required_facts: ["timing|revers", "400,000", "2026-06|June"]
    must_cite:
      - JE-REV-TIMING-REV
    must_not_say: ["churn", "cancellation", "lost customer", "downgrade"]
