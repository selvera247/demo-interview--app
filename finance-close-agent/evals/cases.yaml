# Close-agent eval cases (synthetic Northwind Digital only).
# Planted A/B/C + negative N01–N14 answer keys filled (owner-authorized).

cases:
  # --- Planted anomalies (A1–A4, B1–B2, C1 + pairs) ---

  - id: A1
    account: "6110"
    entity: ND-US
    period: "2026-06"
    variance: 81419.97
    expected_flagged: true
    expected_confidence: high
    expected_explanation: >
      Cloud Hosting was accrued twice in June for the same vendor and
      reference, $85,000 each. The second is a duplicate and should be reversed.
    required_facts: ["duplicate", "85,000"]
    must_cite:
      - ACCR-CLOUD-6110-BASE-2026-06
      - ACCR-CLOUD-6110-DUP-2026-06
    must_not_say: ["usage growth", "increased consumption", "new workload"]
    notes: ""

  - id: A2
    account: "6020"
    entity: ND-EU
    period: "2026-07"
    variance: -118855.81
    expected_flagged: true
    expected_confidence: high
    expected_explanation: >
      Contractors are down $120,000 in ND-EU because a reclass journal moved
      the cost to Professional Fees. Total opex is unchanged.
    required_facts: ["reclass", "120,000", "Professional Fees"]
    must_cite:
      - JE-RCL-6020-2026-07
    must_not_say: ["cost savings", "reduced spend", "headcount reduction", "vendor terminated"]
    notes: ""

